# ===================================================================
# Nexora Multi-Tenant CRM - Spring Boot Configuration for XAMPP MySQL
# ===================================================================

server.port=8080
spring.application.name=nexora-crm-backend

# -------------------------------------------------------------------
# Database Connection (XAMPP MySQL Default: port 3306, user 'root', no password)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nexora_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate Configuration for MySQL
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migrations
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# CORS Configuration (React Frontend)
# -------------------------------------------------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174

# -------------------------------------------------------------------
# OpenAPI / Swagger UI (http://localhost:8080/swagger-ui.html)
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
