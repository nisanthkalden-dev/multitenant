# ===================================================================
# Nexora Multi-Tenant CRM - Spring Boot Configuration for XAMPP / Local MySQL
# ===================================================================

server.port=8080
spring.application.name=nexora-crm-backend

# -------------------------------------------------------------------
# Database Connection (MySQL Default: port 3306, user 'root', password 'root')
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nexora_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate Configuration for MySQL
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migrations (disabled if no migration directory present)
# -------------------------------------------------------------------
spring.flyway.enabled=false

# -------------------------------------------------------------------
# JWT Security Configuration
# Dual Token System: ACCESS (15m) & REFRESH (7d) with distinct secrets
# Configurable via environment variables: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# -------------------------------------------------------------------
jwt.access.secret=${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.refresh.secret=${JWT_REFRESH_SECRET:5367566B5970337336763979244226452948404D6351655468576D5A71347437}

# 15 minutes = 900,000 ms
jwt.access.expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# 7 days = 604,800,000 ms
jwt.refresh.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Legacy compatibility fallback
jwt.secret=${jwt.access.secret}
jwt.expiration-ms=${jwt.access.expiration-ms}

# -------------------------------------------------------------------
# CORS Configuration (React Frontend)
# -------------------------------------------------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174

# -------------------------------------------------------------------
# OpenAPI / Swagger UI (http://localhost:8080/swagger-ui.html)
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
